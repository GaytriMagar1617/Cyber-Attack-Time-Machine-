<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyber Attack Time Machine</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1117;--panel:#131a23;--panel2:#1a2330;--line:#26323f;--text:#dde6ef;--mute:#8797a9;--acc:#f2b44a;--accfg:#1b1300;--low:#5fb3a1;--medium:#e0b341;--high:#ef8a48;--critical:#ef5a5a;--ok:#5fb3a1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f4f8;--panel:#fff;--panel2:#eef2f6;--line:#d6dee7;--text:#16202b;--mute:#5d6e80;--acc:#b8760a;--accfg:#fff}}
:root[data-theme="light"]{--bg:#f1f4f8;--panel:#fff;--panel2:#eef2f6;--line:#d6dee7;--text:#16202b;--mute:#5d6e80;--acc:#b8760a;--accfg:#fff}
:root[data-theme="dark"]{--bg:#0c1117}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 'IBM Plex Sans',system-ui,'Segoe UI',sans-serif}
.mono,.t{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:600;font-size:15px;line-height:1.2;padding:4px 8px 16px}.brand small{display:block;color:var(--mute);font-weight:400;font-size:11px;margin-top:4px}
nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:8px;color:var(--mute);display:flex;gap:10px;align-items:center}
nav button:hover{background:var(--panel2);color:var(--text)}nav button.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 var(--acc)}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,.node:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{padding:22px 26px 40px;min-width:0}
h1{font-size:20px;margin:0 0 4px}h2{font-size:14px;margin:0 0 12px}.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.6fr 1fr}.g2e{grid-template-columns:1fr 1fr}
.kpi b{display:block;font-size:30px;font-weight:600;line-height:1.1}.kpi span{color:var(--mute)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid currentColor}
.LOW{color:var(--low)}.MEDIUM{color:var(--medium)}.HIGH{color:var(--high)}.CRITICAL{color:var(--critical)}
.btn{all:unset;cursor:pointer;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);transition:transform .12s,border-color .12s}
.btn:hover{border-color:var(--acc)}.btn:active{transform:scale(.97)}.btn.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
input,select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;color:var(--mute);font-weight:500;padding:8px;border-bottom:1px solid var(--line)}td{padding:10px 8px;border-bottom:1px solid var(--line)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--panel2)}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px}.bars div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:3px;opacity:.85;transition:height .4s;position:relative}
.bars div:hover{opacity:1}.axis{display:flex;gap:6px;color:var(--mute);font-size:11px;margin-top:4px}.axis span{flex:1;text-align:center}
.hb{display:grid;grid-template-columns:90px 1fr 28px;gap:8px;align-items:center;margin:7px 0}.hb i{display:block;height:8px;border-radius:4px;background:currentColor;transition:width .4s}
.alert{padding:10px 12px;border-left:3px solid currentColor;background:var(--panel2);border-radius:0 8px 8px 0;margin-bottom:8px;animation:in .3s}
.alert p{margin:2px 0 0;color:var(--mute);font-size:13px}
@keyframes in{from{opacity:0;transform:translateX(-6px)}}
.now{text-align:center;padding:10px 0 4px}.now .t{color:var(--acc);font-size:34px;letter-spacing:.04em}.now h2{font-size:19px;margin:2px 0 6px}
.slider{width:100%;accent-color:var(--acc)}.ticks{display:flex;justify-content:space-between;color:var(--mute);font-size:11px;margin:4px 2px 12px}
.ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin:0}dt{color:var(--mute)}dd{margin:0;word-break:break-word}
.chain{display:flex;flex-direction:column;align-items:stretch}
.node{all:unset;cursor:pointer;display:block;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);opacity:.5;transition:all .25s}
.node.seen{opacity:1}.node.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}.node small{color:var(--mute);display:block}
.link{width:2px;height:16px;background:var(--line);margin:0 auto}.link.seen{background:var(--acc)}
.ev{display:flex;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;opacity:.4}.ev.seen{opacity:1}.ev.cur{background:var(--panel2);box-shadow:inset 3px 0 var(--acc)}.ev:hover{background:var(--panel2)}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;margin-top:6px;flex:none}
.tl{display:flex;flex-direction:column;gap:6px}.tl .s{padding:8px 10px;border-radius:8px;background:var(--panel2);display:flex;gap:10px}
.tl .blocked{border:1px dashed var(--critical);color:var(--critical);font-weight:600}.tl .off{opacity:.45;text-decoration:line-through}
.sim{display:inline-block;background:var(--acc);color:var(--accfg);font-size:11px;font-weight:600;padding:1px 8px;border-radius:4px}
.chat{max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.msg{padding:10px 12px;border-radius:10px;background:var(--panel2);max-width:90%;white-space:pre-wrap}.msg.u{background:var(--acc);color:var(--accfg);align-self:flex-end}
.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--panel);border:1px solid var(--acc);padding:10px 14px;border-radius:10px;animation:in .25s;z-index:9}
.skel{height:80px;border-radius:12px;background:linear-gradient(90deg,var(--panel),var(--panel2),var(--panel));background-size:200% 100%;animation:sh 1s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;color:var(--mute);padding:26px}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g2,.g2e{grid-template-columns:1fr}}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;overflow-x:auto;z-index:8;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line)}
.brand{display:none}nav button{flex:none;font-size:12px;padding:8px 10px}main{padding:16px 14px 90px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<nav aria-label="Main">
  <div class="brand">Cyber Attack<br>Time Machine<small>Rewind. Investigate. Prevent.</small></div>
  <button data-go="dash">Dashboard</button>
  <button data-go="inc">Incidents</button>
  <button data-go="tm">Time Machine</button>
  <button data-go="wi">What If?</button>
  <button data-go="ai">Cyber Analyst AI</button>
</nav>
<main id="main"></main>
</div>
<div id="toasts"></div>
<script>
/* ---------- Synthetic data (no real systems, private lab IPs, fictional users) ---------- */
const SEV=['LOW','MEDIUM','HIGH','CRITICAL'];
const R=(t,title,sev,stage,src,user,ip,tech,desc,rule,ctl)=>({t,title,sev,stage,src,user,ip,tech,desc,rule,ctl});
const SC={
cred:{name:'Credential Theft Simulation',sev:'HIGH',ev:[
R(0,'Normal activity','LOW','Baseline','LAB-PC-01','demo-user','192.168.10.15','-','Routine workday authentication and file access.'),
R(180,'Suspicious email received','MEDIUM','Phishing','LAB-MAIL-01','demo-user','192.168.10.15','T1566 Phishing','Simulated email with mismatched sender domain.',null,'Quarantine external email'),
R(300,'Phishing link clicked','MEDIUM','Phishing','LAB-PC-01','demo-user','192.168.10.15','T1566 Phishing','Simulated click on a training phishing link.'),
R(340,'Credentials compromised','HIGH','Credential Compromise','LAB-PC-01','demo-user','192.168.10.15','T1078 Valid Accounts','Simulated credential submission to a lookalike page.'),
R(370,'Suspicious login','HIGH','Suspicious Login','LAB-DC-01','demo-user','10.20.5.77','T1078 Valid Accounts','Login from an unfamiliar synthetic IP within a minute of the compromise.','Rule R1: Login from a new IP shortly after a credential-compromise event.','Block login and require MFA'),
R(430,'Privilege change','CRITICAL','Privilege Change','LAB-DC-01','demo-user','10.20.5.77','T1098 Account Manipulation','User added to a privileged group after a suspicious login.','Rule R2: Privilege change after suspicious login.','Require approval for group changes'),
R(540,'Bulk file modification','HIGH','File Modification','LAB-FS-01','demo-user','10.20.5.77','T1565 Data Manipulation','214 files changed in 60 seconds on a file share.','Rule R3: Unusually large number of file modifications.','Rate-limit file share writes'),
R(600,'Incident detected','CRITICAL','Detection','SIEM-LAB','system','-','-','Correlated alert raised by the detection engine.','Rule R2 + R3 correlation: Privilege change followed by mass file changes.')]},
brute:{name:'Brute Force Simulation',sev:'MEDIUM',ev:[
R(0,'Normal activity','LOW','Baseline','LAB-WEB-01','svc-portal','192.168.20.4','-','Baseline portal traffic.'),
R(60,'Failed login (1 of 6)','LOW','Failed Logins','LAB-WEB-01','test-user','172.16.9.30','T1110 Brute Force','Synthetic failed authentication.'),
R(75,'Failed login (4 of 6)','MEDIUM','Failed Logins','LAB-WEB-01','test-user','172.16.9.30','T1110 Brute Force','Repeated failures from one synthetic source.','Rule R4: 5+ failed logins within 2 minutes.','Lock account after 5 failures'),
R(95,'Failed login (6 of 6)','MEDIUM','Failed Logins','LAB-WEB-01','test-user','172.16.9.30','T1110 Brute Force','Failure count crossed the threshold.'),
R(110,'Successful login','HIGH','Successful Login','LAB-WEB-01','test-user','172.16.9.30','T1078 Valid Accounts','Success right after repeated failures.','Rule R1: Successful login after multiple failed logins.','Block source IP after threshold'),
R(170,'Unusual account activity','HIGH','Suspicious Activity','LAB-DB-01','test-user','172.16.9.30','T1087 Account Discovery','Account listing queries never seen for this user.'),
R(240,'Incident detected','HIGH','Detection','SIEM-LAB','system','-','-','Alert raised for suspicious authentication.','Rule R1 + R4 correlation.')]},
ransom:{name:'Ransomware-Like Behavior Simulation',sev:'CRITICAL',ev:[
R(0,'Normal activity','LOW','Baseline','LAB-PC-07','fin-user','192.168.30.21','-','Routine document editing.'),
R(120,'Suspicious process','MEDIUM','Suspicious Process','LAB-PC-07','fin-user','192.168.30.21','T1204 User Execution','Synthetic unsigned process started from a temp folder.',null,'Block unsigned executables'),
R(200,'Mass file changes','HIGH','Mass File Changes','LAB-PC-07','fin-user','192.168.30.21','T1486 Data Encrypted for Impact','1,400 synthetic file writes in 45 seconds.','Rule R3: Large number of file modifications.','Isolate host on file-write spike'),
R(240,'Abnormal extension changes','CRITICAL','Extension Changes','LAB-FS-02','fin-user','192.168.30.21','T1486 Data Encrypted for Impact','Files renamed to one uncommon extension.','Rule R3b: Bulk extension change.'),
R(300,'Incident detected','CRITICAL','Detection','SIEM-LAB','system','-','-','Ransomware-like behavior alert (simulated).','Rule R3 + R3b correlation.')]}};
let INCS=[];let seq=0;
function addInc(key,status){seq++;const s=SC[key],id='INC-'+String(seq).padStart(3,'0');
 const ev=s.ev.map((e,i)=>({...e,id:id+'-E'+(i+1),inc:id}));
 INCS.push({id,title:s.name,sev:s.sev,status,ev,sys:[...new Set(ev.map(e=>e.src))],users:[...new Set(ev.map(e=>e.user))].filter(u=>u!=='system'),key});return id}
addInc('cred','Open');addInc('brute','Open');addInc('ransom','Closed');
const S={view:'dash',inc:'INC-001',idx:0,play:false,speed:1,timer:null,dashInc:'all',q:'',fs:'',fst:'',wi:null,chat:[]};
const cur=()=>INCS.find(i=>i.id===S.inc);
const $=s=>document.querySelector(s);
const clk=t=>{const T=36000+t,h=Math.floor(T/3600),m=Math.floor(T%3600/60),s=T%60;return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':')};
const badge=s=>`<span class="badge ${s}">${s}</span>`;
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;$('#toasts').appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ---------- Views ---------- */
function go(v){stop();S.view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===v));({dash,inc,tm,wi,ai})[v]();window.scrollTo(0,0)}
function dash(){
 const m=$('#main');m.innerHTML='<div class="grid g4"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
 setTimeout(()=>{
 const all=INCS.flatMap(i=>i.ev),sel=S.dashInc==='all'?all:INCS.find(i=>i.id===S.dashInc).ev;
 const crit=all.filter(e=>e.sev==='CRITICAL').length,sys=new Set(all.map(e=>e.src)).size,usr=new Set(all.map(e=>e.user)).size;
 const alerts=all.filter(e=>e.rule).sort((a,b)=>b.t-a.t).slice(0,5);
 const b=Array.from({length:11},(_,i)=>sel.filter(e=>Math.floor(e.t/60)===i).length),mx=Math.max(...b,1);
 const sevc=SEV.map(s=>[s,sel.filter(e=>e.sev===s).length]),stg={};sel.forEach(e=>{if(e.stage!=='Baseline')stg[e.stage]=(stg[e.stage]||0)+1});
 m.innerHTML=`<h1>Security overview</h1><p class="sub">Simulated telemetry from the lab environment. Nothing here touches a real system.</p>
 <div class="grid g4">
  ${[['Incidents',INCS.length],['Active incidents',INCS.filter(i=>i.status==='Open').length],['Critical events',crit],['Systems affected',sys]].map(k=>`<div class="card kpi"><b data-n="${k[1]}">0</b><span>${k[0]}</span></div>`).join('')}
 </div>
 <div class="row" style="margin-top:14px"><label for="di" class="sub" style="margin:0">Charts show</label><select id="di"><option value="all">All incidents</option>${INCS.map(i=>`<option value="${i.id}" ${S.dashInc===i.id?'selected':''}>${i.id} ${i.title}</option>`).join('')}</select><span class="sub" style="margin:0">${usr} users involved</span></div>
 <div class="grid g2"><div class="card"><h2>Events over time (per minute after 10:00)</h2><div class="bars">${b.map(v=>`<div style="height:${v/mx*100}%" title="${v} events"></div>`).join('')}</div><div class="axis">${b.map((_,i)=>`<span>${i}</span>`).join('')}</div></div>
 <div class="card"><h2>Severity</h2>${sevc.map(([s,n])=>`<div class="hb ${s}"><span style="color:var(--text)">${s}</span><div><i style="width:${n/Math.max(sel.length,1)*100}%"></i></div><span>${n}</span></div>`).join('')}
 <h2 style="margin-top:16px">Attack stages</h2>${Object.entries(stg).map(([s,n])=>`<div class="hb"><span>${s}</span><div><i style="width:${n*40}%;color:var(--acc)"></i></div><span>${n}</span></div>`).join('')||'<div class="empty">No attack stages yet.</div>'}</div></div>
 <div class="grid g2e" style="margin-top:14px"><div class="card"><h2>Recent alerts</h2>${alerts.map(e=>`<div class="alert ${e.sev}"><b style="color:var(--text)">${e.title}</b> ${badge(e.sev)}<p>${e.inc} at ${clk(e.t)}: ${e.rule}</p></div>`).join('')}</div>
 <div class="card"><h2>Recent incidents</h2>${INCS.map(i=>`<div class="ev seen" data-open="${i.id}" style="opacity:1"><span class="dot ${i.sev}"></span><div style="flex:1"><b>${i.id}</b> ${i.title}</div>${badge(i.sev)}</div>`).join('')}
 <button class="btn p" data-demo style="margin-top:12px">Start demo investigation</button></div></div>`;
 m.querySelectorAll('[data-n]').forEach(el=>{const to=+el.dataset.n,t0=performance.now();(function f(t){const p=Math.min((t-t0)/700,1);el.textContent=Math.round(to*p);if(p<1)requestAnimationFrame(f)})(t0)});
 },250)}

function inc(){
 const rows=INCS.filter(i=>(!S.q||(i.id+i.title+i.users.join()+i.sys.join()).toLowerCase().includes(S.q.toLowerCase()))&&(!S.fs||i.sev===S.fs)&&(!S.fst||i.status===S.fst));
 $('#main').innerHTML=`<h1>Incidents</h1><p class="sub">Search by ID, title, user or machine. Open one to rewind it.</p>
 <div class="row"><input id="q" placeholder="Search incidents" value="${S.q}" aria-label="Search"><select id="fs"><option value="">All severities</option>${SEV.map(s=>`<option ${S.fs===s?'selected':''}>${s}</option>`).join('')}</select>
 <select id="fst"><option value="">All statuses</option>${['Open','Closed'].map(s=>`<option ${S.fst===s?'selected':''}>${s}</option>`).join('')}</select>
 <select id="sc">${Object.entries(SC).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select><button class="btn p" data-new>Start simulation</button></div>
 <div class="card scroll"><table><thead><tr><th>ID</th><th>Title</th><th>Severity</th><th>Status</th><th>Systems</th><th>Users</th><th></th></tr></thead><tbody>
 ${rows.map(i=>`<tr data-open="${i.id}"><td class="mono">${i.id}</td><td>${i.title}</td><td>${badge(i.sev)}</td><td>${i.status}</td><td>${i.sys.join(', ')}</td><td>${i.users.join(', ')}</td><td><button class="btn" data-toggle="${i.id}">${i.status==='Open'?'Close':'Reopen'}</button></td></tr>`).join('')}</tbody></table>
 ${rows.length?'':'<div class="empty">No incidents match. Clear a filter or start a simulation.</div>'}</div>`;
 const q=$('#q');if(document.activeElement===document.body&&S.q){q.focus();q.setSelectionRange(99,99)}}

/* Time Machine */
function tm(){
 const c=cur();
 $('#main').innerHTML=`<h1>Time Machine</h1><div class="row"><select id="ti">${INCS.map(i=>`<option value="${i.id}" ${i.id===S.inc?'selected':''}>${i.id} ${i.title}</option>`).join('')}</select><span class="sim">SIMULATED DATA</span></div>
 <div class="card"><div id="now" class="now"></div>
 <input id="sl" class="slider" type="range" min="0" max="${c.ev.length-1}" value="${S.idx}" aria-label="Timeline position"><div class="ticks mono">${c.ev.map(e=>`<span>${clk(e.t).slice(3,8)}</span>`).join('')}</div>
 <div class="ctl"><button class="btn" data-t="first" aria-label="Jump to first event">⏮</button><button class="btn" data-t="prev" aria-label="Previous event">◀</button><button class="btn p" data-t="play" id="pl" style="min-width:90px">Play</button><button class="btn" data-t="next" aria-label="Next event">▶</button><button class="btn" data-t="last" aria-label="Jump to detection">⏭</button>
 <select id="sp" aria-label="Speed">${[1,2,4].map(s=>`<option value="${s}" ${S.speed===s?'selected':''}>${s}x</option>`).join('')}</select><button class="btn" data-t="restart">Replay incident</button></div></div>
 <div class="grid g2e" style="margin-top:14px"><div class="card"><h2>Event details</h2><div id="det"></div></div><div class="card"><h2>Attack chain</h2><div id="chain" class="chain"></div></div></div>
 <div class="card" style="margin-top:14px"><h2>All events</h2><div id="list"></div></div>`;
 upd()}
function upd(){
 const c=cur(),e=c.ev[S.idx];if(!$('#now'))return;
 $('#now').innerHTML=`<div class="t">${clk(e.t)}</div><h2>${e.title}</h2>${badge(e.sev)} <span style="color:var(--mute)">${e.stage}</span>${e.rule?`<div class="alert ${e.sev}" style="text-align:left;margin:12px auto 0;max-width:560px"><b style="color:var(--text)">Why it was flagged</b><p>${e.rule}</p></div>`:''}`;
 $('#sl').value=S.idx;$('#pl').textContent=S.play?'Pause':'Play';
 const rel=c.ev.filter(x=>x!==e&&x.stage===e.stage).map(x=>x.id).join(', ')||'None';
 $('#det').innerHTML=`<dl><dt>Event ID</dt><dd class="mono">${e.id}</dd><dt>Timestamp</dt><dd class="mono">${clk(e.t)}</dd><dt>Severity</dt><dd>${badge(e.sev)}</dd><dt>Source</dt><dd>${e.src}</dd><dt>User</dt><dd>${e.user}</dd><dt>IP (synthetic)</dt><dd class="mono">${e.ip}</dd><dt>Stage</dt><dd>${e.stage}</dd><dt>MITRE ATT&amp;CK</dt><dd>${e.tech}</dd><dt>Description</dt><dd>${e.desc}</dd><dt>Related</dt><dd class="mono">${rel}</dd></dl>`;
 const st=[...new Set(c.ev.filter(x=>x.stage!=='Baseline').map(x=>x.stage))],cs=c.ev[S.idx].stage;
 const seen=s=>c.ev.findIndex(x=>x.stage===s)<=S.idx;
 $('#chain').innerHTML=st.map((s,i)=>`${i?`<div class="link ${seen(s)?'seen':''}"></div>`:''}<button class="node ${seen(s)?'seen':''} ${s===cs?'cur':''}" data-stage="${s}">${s}<small>${c.ev.filter(x=>x.stage===s).length} event(s)</small></button>`).join('');
 $('#list').innerHTML=c.ev.map((x,i)=>`<div class="ev ${i<=S.idx?'seen':''} ${i===S.idx?'cur':''}" data-i="${i}"><span class="dot ${x.sev}"></span><span class="mono" style="color:var(--mute)">${clk(x.t)}</span><span style="flex:1">${x.title}</span>${badge(x.sev)}</div>`).join('')}
function stop(){S.play=false;clearInterval(S.timer)}
function play(){if(S.play){stop();upd();return}if(S.idx>=cur().ev.length-1)S.idx=0;S.play=true;S.timer=setInterval(()=>{if(S.idx>=cur().ev.length-1){stop()}else S.idx++;upd()},1400/S.speed);upd()}

/* What If */
function wi(){
 const c=cur(),opts=c.ev.map((e,i)=>({e,i})).filter(o=>o.e.ctl);
 $('#main').innerHTML=`<h1>What If?</h1><p class="sub">Pick a defensive control and compare timelines. <span class="sim">SIMULATION</span> It replays recorded lab events only and does not predict real-world outcomes.</p>
 <div class="row"><select id="wsel">${INCS.map(i=>`<option value="${i.id}" ${i.id===S.inc?'selected':''}>${i.id} ${i.title}</option>`).join('')}</select></div>
 <div class="card"><h2>Choose an intervention</h2><div class="row">${opts.map(o=>`<button class="btn ${S.wi===o.i?'p':''}" data-wi="${o.i}">${o.e.ctl} <span style="opacity:.7">@ ${clk(o.e.t).slice(3)}</span></button>`).join('')}</div></div>
 <div id="wres" style="margin-top:14px"></div>`;
 if(S.wi!==null&&c.ev[S.wi]&&c.ev[S.wi].ctl){const b=S.wi,col=(dim)=>c.ev.map((e,i)=>i>b?`<div class="s ${dim?'off':''}"><span class="mono">${clk(e.t)}</span>${e.title}</div>`:`<div class="s"><span class="mono">${clk(e.t)}</span>${e.title}</div>`);
 const after=c.ev.slice(b+1).filter(x=>x.stage!=='Detection').length;
 $('#wres').innerHTML=`<div class="grid g2e"><div class="card"><h2>Actual timeline</h2><div class="tl">${col(false).join('')}</div></div>
 <div class="card"><h2>Alternate timeline <span class="sim">SIMULATION</span></h2><div class="tl">${c.ev.slice(0,b+1).map(e=>`<div class="s"><span class="mono">${clk(e.t)}</span>${e.title}</div>`).join('')}<div class="s blocked">BLOCKED by control: ${c.ev[b].ctl}</div>${c.ev.slice(b+1).map(e=>`<div class="s off"><span class="mono">${clk(e.t)}</span>${e.title}</div>`).join('')}</div>
 <p class="sub" style="margin-top:12px">Attack chain interrupted at "${c.ev[b].stage}". ${after} later event(s) would not have occurred in this simulated scenario.</p></div></div>`}
 else $('#wres').innerHTML='<div class="card empty">Select a control above to generate the alternate timeline.</div>'}

/* Cyber Analyst AI: rule-based fallback, answers only from recorded data */
function answer(q){
 const c=cur(),ev=c.ev,L=q.toLowerCase(),att=ev.filter(e=>e.stage!=='Baseline'),fl=ev.filter(e=>e.rule),det=ev[ev.length-1];
 if(/first|start|begin/.test(L)){const f=att[0];return `The first suspicious event was "${f.title}" at ${clk(f.t)} on ${f.src} (user ${f.user}, ${f.sev}). ${f.desc}`}
 if(/system|affect|machine|host/.test(L))return `Systems in ${c.id}: ${c.sys.join(', ')}. Users involved: ${c.users.join(', ')}.`;
 if(/why|flag|rule|detect/.test(L))return fl.map(e=>`• ${e.title} (${clk(e.t)}): ${e.rule}`).join('\n')||'No detection rules fired.';
 if(/before/.test(L))return `Events before the alert at ${clk(det.t)}:\n`+ev.slice(0,-1).map(e=>`• ${clk(e.t)} ${e.title}`).join('\n');
 if(/chain|summar|what happen/.test(L))return `${c.title} (${c.id}, ${c.sev}). Chain: ${[...new Set(att.map(e=>e.stage))].join(' → ')}.\nFirst suspicious event at ${clk(att[0].t)}; alert raised at ${clk(det.t)}, ${Math.round((det.t-att[0].t)/60)} minutes later.`;
 if(/prevent|interrupt|control|defen|stop/.test(L)){const o=ev.find(e=>e.ctl);return o?`The earliest recorded control point is "${o.ctl}" at ${clk(o.t)} (${o.title}). Try it in the What If? tab. This is a simulation, not a prediction.`:'No control points are recorded for this incident.'}
 return 'I can only answer from this incident\'s recorded events. Try: what happened, first suspicious event, affected systems, why flagged, events before the alert, or where a control could interrupt it.'}
function ai(){
 const Q=['What happened in this incident?','What was the first suspicious event?','Which systems were affected?','Why was this event flagged?','What events happened before the alert?','Where could a defensive control have interrupted it?'];
 $('#main').innerHTML=`<h1>Cyber Analyst AI</h1><p class="sub">Built-in rule-based analyst. Answers come only from the recorded lab events of the selected incident.</p>
 <div class="row"><select id="asel">${INCS.map(i=>`<option value="${i.id}" ${i.id===S.inc?'selected':''}>${i.id} ${i.title}</option>`).join('')}</select></div>
 <div class="card"><div class="chat" id="chat">${S.chat.length?S.chat.map(m=>`<div class="msg ${m.u?'u':''}">${m.t}</div>`).join(''):'<div class="empty">Ask a question or tap a suggestion.</div>'}</div>
 <div class="row">${Q.map(x=>`<button class="btn" data-q="${x}">${x}</button>`).join('')}</div>
 <div class="row" style="margin:0"><input id="aq" style="flex:1;min-width:200px" placeholder="Ask about this incident" aria-label="Question"><button class="btn p" data-ask>Ask</button></div></div>`;
 const ch=$('#chat');ch.scrollTop=ch.scrollHeight}
function ask(t){if(!t.trim())return;S.chat.push({u:1,t:t.replace(/</g,'&lt;')},{t:answer(t)});ai()}

/* ---------- Events (delegated) ---------- */
document.addEventListener('click',e=>{const g=s=>e.target.closest(s);let x;
 if(x=g('[data-go]'))return go(x.dataset.go);
 if(x=g('[data-toggle]')){const i=INCS.find(i=>i.id===x.dataset.toggle);i.status=i.status==='Open'?'Closed':'Open';toast(`${i.id} ${i.status==='Open'?'reopened':'closed'}`);return inc()}
 if(x=g('[data-open]')){S.inc=x.dataset.open;S.idx=0;S.wi=null;return go('tm')}
 if(g('[data-new]')){const id=addInc($('#sc').value,'Open');S.inc=id;S.idx=0;S.wi=null;toast(`${id} created. Press Play to replay it.`);return go('tm')}
 if(g('[data-demo]')){const id=addInc('cred','Open');S.inc=id;S.idx=0;S.wi=null;toast(`Demo incident ${id} created`);go('tm');return play()}
 if(x=g('[data-t]')){const n=cur().ev.length-1,a=x.dataset.t;if(a==='play')return play();stop();S.idx=a==='first'?0:a==='last'?n:a==='prev'?Math.max(0,S.idx-1):a==='next'?Math.min(n,S.idx+1):0;if(a==='restart')play();return upd()}
 if(x=g('[data-stage]')){stop();S.idx=cur().ev.findIndex(v=>v.stage===x.dataset.stage);return upd()}
 if(x=g('#list .ev')){stop();S.idx=+x.dataset.i;return upd()}
 if(x=g('[data-wi]')){S.wi=+x.dataset.wi;toast('Alternate timeline generated (simulation)');return wi()}
 if(x=g('[data-q]'))return ask(x.dataset.q);
 if(g('[data-ask]'))return ask($('#aq').value)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='sl'){stop();S.idx=+t.value;upd()}
 else if(t.id==='q'){S.q=t.value;inc()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='di'){S.dashInc=t.value;dash()}
 else if(t.id==='fs'){S.fs=t.value;inc()}else if(t.id==='fst'){S.fst=t.value;inc()}
 else if(['ti','wsel','asel'].includes(t.id)){S.inc=t.value;S.idx=0;S.wi=null;S.chat=[];go(S.view)}
 else if(t.id==='sp'){S.speed=+t.value;if(S.play){stop();play()}}});
document.addEventListener('keydown',e=>{if(e.target.id==='aq'&&e.key==='Enter')ask(e.target.value)});
go('dash');
</script>
</body>
